[package]
name = "chainview"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Joaquin Bejar <jb@taunais.com>"]
description = "Terminal UI for option chains, Greeks and volatility - real-time market data and backtest replay in your terminal."
license = "MIT"
readme = "README.md"
repository = "https://github.com/joaquinbejar/ChainView"
homepage = "https://github.com/joaquinbejar/ChainView"
keywords = ["finance", "options", "tui", "terminal", "trading"]
categories = ["finance", "command-line-utilities"]
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

# `cargo binstall` packaging (issue #58, docs/RELEASE-PROCESS.md). These keys let
# `cargo binstall chainview` resolve the prebuilt binary attached to the GitHub
# Release instead of a source build. They describe EXACTLY the artifacts
# `.github/workflows/release.yml` produces at a `v*` tag cut: one gzip tarball per
# target named `chainview-<target>.tar.gz`, with the `chainview` binary at the
# archive root. No new runtime dependency — this is metadata only, ignored by
# `cargo build`.
#
# Template tokens resolved by binstall: `{ repo }` = the `repository` field above;
# `{ name }`/`{ bin }` = `chainview`; `{ version }` = the tag's version;
# `{ target }` = the Rust target triple; `{ archive-suffix }` = `.tar.gz` (from
# `pkg-fmt = "tgz"`); `{ binary-ext }` = empty on the four unix targets shipped.
# Example resolved asset:
#   https://github.com/joaquinbejar/ChainView/releases/download/v1.0.0/chainview-aarch64-apple-darwin.tar.gz
#
# HONESTY (issue #58): the crate on crates.io is still the `v0.0.1`
# name-reservation placeholder, so `cargo binstall chainview` cannot be run
# end-to-end until the first real publish. This block is validated for
# WELL-FORMEDNESS — it parses through `cargo metadata` and the tokens match the
# release-workflow naming per the binstall spec — NOT by an end-to-end install of
# an unpublished crate. The end-to-end `cargo binstall` verification is a
# release-cut step run post-publish (docs/RELEASE-PROCESS.md §12).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[features]
# `bench` gates the bench-only support surface (`src/bench_support.rs` plus the
# `#[cfg(feature = "bench")]` constructors reached by `benches/*`). It is OFF by
# default and OUT of the semver-governed public API: a normal `cargo build`
# (no `--features bench`) exposes the exact same public surface it did before —
# nothing under this feature appears without it (issue #21). The three
# `[[bench]]` targets set `required-features = ["bench"]`, so `cargo bench`
# without the feature simply skips them.
bench = []
# `tastytrade` gates the whole tastytrade adapter (`src/providers/tastytrade.rs`,
# issue #40). It is DISABLED by default and stays off the shippable set: the
# published tastytrade 0.3.0 (the checksum-pinned artifact ChainView resolves) logs
# the session token, the DXLink token, and the raw quote-token body at DEBUG — a
# credential-guarantee violation (docs/SECURITY.md §2.1). The provider is
# therefore excluded from `with_builtins()` and reachable only via the explicit
# `with_gated_builtin(id)` opt-in, which fails with a typed startup error while
# the gate holds — so a stock binary can NEVER execute the upstream's logging
# (docs/SECURITY.md §2/§3). A normal `cargo build` (no `--features tastytrade`)
# does not compile the adapter or pull the `tastytrade` crate at all. `dep:` keeps
# the optional crate from implicitly defining a same-named feature.
tastytrade = ["dep:tastytrade"]
# `alpaca` gates the whole Alpaca adapter (`src/providers/alpaca.rs`, issues #41,
# #99). Its upstream credential-logging SECURITY gate is LIFTED (docs/SECURITY.md
# §2.4): the pinned `alpaca-websocket 0.6.0` masks the key and never logs the
# secret, proven by a captured-log test at the ChainView boundary
# (`test_auth_subscribe_cycle_never_logs_credentials`). So under this feature the
# adapter is a REAL built-in — `with_builtins()` registers it when its
# `CHAINVIEW_ALPACA_*` credentials are configured (and omits it, never erroring,
# when they are absent, so zero-config Deribit is unaffected). The feature stays
# DISABLED by default only to keep the heavy upstream deps out of a default build:
# a normal `cargo build` (no `--features alpaca`) does not compile the adapter or
# pull the `alpaca-http` / `alpaca-websocket` crates at all. `dep:` keeps the
# optional crates from implicitly defining same-named features.
alpaca = ["dep:alpaca-http", "dep:alpaca-websocket", "dep:futures-util"]
# `fuzz` gates the fuzz-only harness surface (`src/fuzz_support.rs` plus the
# `#[cfg(feature = "fuzz")]` `pub(crate)` Deribit normalize entry points reached
# by the separate `fuzz/` cargo-fuzz crate, issue #53). It is OFF by default and
# OUT of the semver-governed public API: a normal `cargo build` (no `--features
# fuzz`) exposes the exact same public surface it did before and never compiles
# the harness — nothing under this feature appears without it. It adds NO
# dependency to the main tree (`fuzz = []`); the cargo-fuzz/libfuzzer-sys deps
# live only in `fuzz/Cargo.toml`, a separate crate excluded from the default
# workspace build (docs/TESTING.md §13.4, docs/SECURITY.md §7).
fuzz = []
# `dxlink` gates the whole standalone DXLink overlay adapter
# (`src/providers/dxlink.rs`, issue #42). It is DISABLED by default and stays off
# the shippable set: like tastytrade and Alpaca, the adapter is excluded from
# `with_builtins()` and reachable only via the explicit `with_gated_builtin(id)`
# opt-in, which fails with a typed startup error while the gate holds
# (docs/SECURITY.md §2.4). A normal `cargo build` (no `--features dxlink`) does
# not compile the adapter or pull the `dxlink` crate at all. `dep:` keeps the
# optional crate from implicitly defining a same-named feature.
dxlink = ["dep:dxlink"]
# `ig` gates the whole IG adapter (`src/providers/ig.rs`, issue #39). It is a
# DEPENDENCY-WEIGHT gate per ADR-0013 (NOT a credential-logging security gate): when
# ON, IG is a REAL built-in — `with_builtins()` registers it when its
# `CHAINVIEW_IG_*` credentials are configured (and omits it, never erroring, when
# they are absent, so zero-config Deribit is unaffected), never reached through
# `with_gated_builtin`. It is DISABLED by default to keep the heavy upstream deps
# out of a default build: a normal `cargo build` (no `--features ig`) does not
# compile the adapter or pull `ig-client` at all.
#
# ADR-0007 audit note: `ig-client 0.12.3` ships Cargo features
# `default = ["persistence","streaming"]`; ChainView consumes BOTH legs (default
# features), so the adapter can drive the env-free `Config::from_credentials` +
# `Client::with_config` REST path AND the Lightstreamer streaming leg
# (`StreamerClient::with_client`). This pulls `sqlx 0.9` (MSRV 1.94 — already the
# crate floor, raised for exactly this path) and `lightstreamer-rs 0.3.3` (the
# live-quote transport). `lightstreamer-rs 0.3.3` is GPL-3.0-only: the project
# OWNER has decided to ACCEPT it (issue #39), scoped to this optional feature via a
# per-crate license exception in `deny.toml` (never a global GPL allow). The
# transitive `dotenv 0.15` is covered by the extended RUSTSEC-2021-0141 ignore in
# `deny.toml` — ChainView uses the env-free `Config::from_credentials`, never
# dotenv. `dep:` keeps the optional crate from implicitly defining a same-named
# feature.
ig = ["dep:ig-client"]
# `ibkr` gates the whole Interactive Brokers adapter (`src/providers/ibkr.rs`,
# issue #120). Like `ig` it is a DEPENDENCY-WEIGHT gate (ADR-0014), NOT a
# credential-logging security gate: when ON, IBKR is a REAL built-in —
# `with_builtins()` registers it when its `CHAINVIEW_IBKR_ENDPOINT` is configured
# (and omits it, never erroring, when absent, so zero-config Deribit is
# unaffected), never reached through `with_gated_builtin`. It is DISABLED by
# default to keep the `ibapi` client tree out of a default build: a normal
# `cargo build` (no `--features ibkr`) does not compile the adapter or pull
# `ibapi` at all.
#
# ADR-0007 audit note: `ibapi 3.3.0` is MIT-licensed (no license exception, unlike
# `ig`'s GPL `lightstreamer-rs`), async by default (`default = ["async"]`, pulling
# `tokio`/`tokio-stream`/`futures`/`async-trait`, all already in the tree), and its
# other deps (`prost`, `time`, `time-tz`, `byteorder`, `serde`/`serde_json`,
# `thiserror`, `log`) are permissive (MIT/Apache-2.0/ISC) and add no new advisory
# (go/no-go GREEN, recorded on issue #120; `cargo audit` + `cargo deny check`
# clean). Auth is injected programmatically: the adapter reads
# `CHAINVIEW_IBKR_ENDPOINT` (`host:port`, or the `scheme://host:port` form the
# shared config layer requires of a SELECTED provider's endpoint — the adapter
# normalizes either to the socket address) + `CHAINVIEW_IBKR_CLIENT_ID` from the env
# and calls `ibapi::Client::connect(endpoint, client_id)` — the TWS/Gateway holds
# the session, so ChainView carries NO credential (auth: None at the seam). `ibapi`
# performs no dotenv load, no foreign env namespace read, and installs no global
# tracing subscriber on construction (verified against the 3.3.0 checkout). `dep:`
# keeps the optional crate from implicitly defining a same-named feature.
ibkr = ["dep:ibapi"]

[lib]
name = "chainview"
path = "src/lib.rs"

[[bin]]
name = "chainview"
path = "src/main.rs"

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
humantime = "2.4"
clap = { version = "4.6", features = ["derive"] }
dotenvy = "0.15"
optionstratlib = { version = "0.20", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
async-trait = "0.1"
tokio = { version = "1.53", default-features = false, features = [
    "sync",
    "rt",
    "macros",
    "time",
] }
tokio-util = { version = "0.7", default-features = false }
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"
deribit-http = "0.7"
deribit-websocket = "0.3"
tastytrade = { version = "0.4", optional = true }
alpaca-http = { version = "0.21", optional = true }
alpaca-websocket = { version = "0.6", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
dxlink = { version = "0.3", optional = true }
ig-client = { version = "0.16", optional = true }
ibapi = { version = "3.3", optional = true }
parquet = { version = "59.2", default-features = false, features = [
    "arrow",
    "snap",
    "zstd",
    "lz4",
] }
arrow-array = "59.2"
tracing = "0.1"

[dev-dependencies]
proptest = "1.11"
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }
hdrhistogram = "7.6"
tokio = { version = "1.53", default-features = false, features = [
    "test-util",
    "net",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
] }
arrow-schema = "59.2"
tempfile = "3.27"
trybuild = "1.0"

[[test]]
name = "terminal_restore"
harness = false

[lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# The three v0.1 hot-path benches (issue #21). Each is a `harness = false`
# binary (its own `main` drives criterion + the hdrhistogram tail report) and is
# gated behind the `bench` feature, so it compiles only under
# `cargo bench --features bench` and never touches the default build.
[[bench]]
name = "bench_render_chain"
harness = false
required-features = ["bench"]

[[bench]]
name = "bench_event_fanin"
harness = false
required-features = ["bench"]

[[bench]]
name = "bench_chain_merge"
harness = false
required-features = ["bench"]

# HP-4 — the replay table decode (issue #36). Like the other three it is a
# `harness = false` binary (its own `main` drives criterion + the hdrhistogram
# tail report) gated behind the `bench` feature, so it compiles only under
# `cargo bench --features bench` and never touches the default build. It benches
# the PUBLIC `BundleReader` open+load path (no `bench_support` needed) over a
# conformance bundle generated by the shared `tests/common/bundle_gen.rs`.
[[bench]]
name = "bench_replay_decode"
harness = false
required-features = ["bench"]

[profile.release]
lto = true
codegen-units = 1
